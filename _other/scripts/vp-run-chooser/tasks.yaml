# Task groups for `<runner> run choose`. Names must match package.json scripts.
# Ungrouped scripts appear under "other" at the end.

order: [check, tools, template]

groups:
  check:
    check: Run formatting, linting, type checks, and local template health checks

  tools:
    skills: Link skills — interactive picker
    skills:all: Apply skills.yaml exactly, no prompts
    skills:check: Preview skill symlink changes
    skills:prune: Report stale links and config drift
    skills:links: List every symlink in the repo
    skills:config: Edit skills.yaml in $EDITOR

  template:
    template:init: Name a new project and strip its sample content
    template:check: Run local repository health checks
    template:reset: Preview stripping the template's sample content
    template:reset:apply: Strip the template's sample content
    template:config: Edit template.yaml in $EDITOR
